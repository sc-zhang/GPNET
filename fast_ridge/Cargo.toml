[package]
name = "fast_ridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { "version" = "0.27.2", features = ["extension-module"] }
numpy = "0.27.1"
nalgebra = { version = "0.34.1", features = ["serde-serialize"] }
rayon = "1.11.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
